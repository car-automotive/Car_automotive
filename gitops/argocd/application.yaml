# ============================================
# ArgoCD Application for Car Automotive
# ============================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: car-automotive
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/opsera-ai/fullstackapp.git
    targetRevision: firstcicdtest
    path: Car_automotive/k8s/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: car-automotive

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true

  revisionHistoryLimit: 3

