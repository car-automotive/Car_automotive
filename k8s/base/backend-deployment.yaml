# ============================================
# Car Automotive Backend Deployment
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-automotive-backend
  labels:
    app: car-automotive-backend
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: car-automotive-backend
  template:
    metadata:
      labels:
        app: car-automotive-backend
        component: backend
    spec:
      containers:
        - name: backend
          image: 792373136340.dkr.ecr.us-west-2.amazonaws.com/car-automotive-backend:latest
          ports:
            - containerPort: 5000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: car-automotive-secrets
                  key: jwt-secret
                  optional: true
            - name: FRONTEND_URL
              value: "https://car-automotive.agents.opsera-labs.com"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      restartPolicy: Always

