apiVersion: v1
kind: Service
metadata:
  name: car-automotive-test1-frontend
  labels:
    app: car-automotive-test1-frontend
    app.kubernetes.io/name: car-automotive-test1
    app.kubernetes.io/component: frontend
  annotations:
    # ExternalDNS creates Route53 A record automatically
    external-dns.alpha.kubernetes.io/hostname: car-automotive-test1.agents.opsera-labs.com
    # NLB with HTTPS (TLS termination at load balancer)
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:us-west-1:792373136340:certificate/817da31f-83bb-44f2-b8b8-ae4372cff9bd"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
    - name: https
      port: 443
      targetPort: 3000
      protocol: TCP
  selector:
    app: car-automotive-test1-frontend

