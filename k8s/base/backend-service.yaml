# ============================================
# Car Automotive Backend Service
# ============================================
apiVersion: v1
kind: Service
metadata:
  name: car-automotive-backend
  labels:
    app: car-automotive-backend
    component: backend
spec:
  type: ClusterIP
  selector:
    app: car-automotive-backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP

