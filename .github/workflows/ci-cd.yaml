name: CI/CD Pipeline

on:
  push:
    branches: [car-automotive]
  pull_request:
    branches: [car-automotive]

permissions:
  contents: write
  id-token: write

env:
  APP_NAME: car-automotive
  ECR_REGION: us-west-2
  EKS_REGION: us-west-1
  AWS_ACCOUNT_ID: "792373136340"
  CLUSTER_NAME: argocd-nonprod-eks
  ENDPOINT: https://car-automotive.agents.opsera-labs.com

jobs:
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.ECR_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.APP_NAME }}-backend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.APP_NAME }}-backend:latest
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.APP_NAME }}-backend:buildcache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.APP_NAME }}-backend:buildcache,mode=max

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.ECR_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.APP_NAME }}-frontend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.APP_NAME }}-frontend:latest
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.APP_NAME }}-frontend:buildcache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.APP_NAME }}-frontend:buildcache,mode=max

  update-kustomize:
    name: Update Kustomize Image Tags
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update image tags in kustomization.yaml
        run: |
          cd k8s/overlays/dev
          # Update backend image tag (match the line with car-automotive-backend, then update the next line's newTag)
          sed -i "/car-automotive-backend/,+1 s|newTag:.*|newTag: ${{ github.sha }}|" kustomization.yaml
          # Update frontend image tag
          sed -i "/car-automotive-frontend/,+1 s|newTag:.*|newTag: ${{ github.sha }}|" kustomization.yaml
          # Show updated file
          echo "Updated kustomization.yaml:"
          cat kustomization.yaml

      - name: Commit and push changes
        run: |
          git add k8s/overlays/dev/kustomization.yaml
          git diff --staged --quiet || git commit -m "chore: update image tags to ${{ github.sha }}"
          git push

  verify-deployment:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [update-kustomize]
    if: always() && needs.update-kustomize.result == 'success'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.EKS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.EKS_REGION }}

      - name: Wait for ArgoCD sync
        run: |
          echo "Waiting for ArgoCD to detect changes and start sync..."
          sleep 30
          MAX_ATTEMPTS=30
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            SYNC_STATUS=$(kubectl get application ${{ env.APP_NAME }} -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "Unknown")
            HEALTH_STATUS=$(kubectl get application ${{ env.APP_NAME }} -n argocd -o jsonpath='{.status.health.status}' 2>/dev/null || echo "Unknown")
            echo "Attempt $((ATTEMPT+1))/$MAX_ATTEMPTS: Sync=$SYNC_STATUS, Health=$HEALTH_STATUS"
            if [ "$SYNC_STATUS" == "Synced" ] && [ "$HEALTH_STATUS" == "Healthy" ]; then
              echo "ArgoCD application is synced and healthy!"
              break
            fi
            ATTEMPT=$((ATTEMPT+1))
            sleep 10
          done

      - name: Wait for pods to be ready
        run: |
          kubectl rollout status deployment/${{ env.APP_NAME }}-backend -n ${{ env.APP_NAME }} --timeout=300s || true
          kubectl rollout status deployment/${{ env.APP_NAME }}-frontend -n ${{ env.APP_NAME }} --timeout=300s || true
          kubectl get pods -n ${{ env.APP_NAME }} -o wide

      - name: Wait for LoadBalancer and DNS
        run: |
          MAX_ATTEMPTS=30
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            LB_HOSTNAME=$(kubectl get svc ${{ env.APP_NAME }}-frontend -n ${{ env.APP_NAME }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            if [ -n "$LB_HOSTNAME" ]; then
              echo "LoadBalancer provisioned: $LB_HOSTNAME"
              break
            fi
            ATTEMPT=$((ATTEMPT+1))
            sleep 10
          done
          echo "Waiting for DNS propagation (60s)..."
          sleep 60

      - name: Verify endpoint
        run: |
          MAX_ATTEMPTS=10
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${{ env.ENDPOINT }}" 2>/dev/null || echo "000")
            echo "Attempt $((ATTEMPT+1))/$MAX_ATTEMPTS: HTTP Status = $HTTP_STATUS"
            if [ "$HTTP_STATUS" == "200" ] || [ "$HTTP_STATUS" == "301" ] || [ "$HTTP_STATUS" == "302" ]; then
              echo "DEPLOYMENT SUCCESSFUL!"
              echo "Endpoint: ${{ env.ENDPOINT }}"
              exit 0
            fi
            ATTEMPT=$((ATTEMPT+1))
            sleep 15
          done
          echo "WARNING: Endpoint verification incomplete. Check manually: ${{ env.ENDPOINT }}"

      - name: Deployment summary
        run: |
          echo "========================================"
          echo "        DEPLOYMENT SUMMARY              "
          echo "========================================"
          echo "App Name:    ${{ env.APP_NAME }}"
          echo "Endpoint:    ${{ env.ENDPOINT }}"
          echo "========================================"
          kubectl get all -n ${{ env.APP_NAME }}

