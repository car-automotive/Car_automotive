# ============================================
# Car Automotive CI/CD Pipeline
# ============================================
# Builds, tests, and deploys to AWS EKS via GitOps

name: CI/CD Pipeline

on:
  push:
    branches: [firstcicdtest]
  pull_request:
    branches: [firstcicdtest]

permissions:
  contents: write
  id-token: write

env:
  APP_NAME: car-automotive
  AWS_ACCOUNT_ID: "792373136340"
  ECR_REGION: us-west-2
  EKS_REGION: us-west-1
  CLUSTER_NAME: argocd-nonprod-eks
  ENDPOINT: https://car-automotive.agents.opsera-labs.com

jobs:
  # ==========================================
  # Job 1: Build and Push Backend
  # ==========================================
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.ECR_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if not exists
        run: |
          aws ecr describe-repositories --repository-names ${{ env.APP_NAME }}-backend --region ${{ env.ECR_REGION }} 2>/dev/null || \
          aws ecr create-repository --repository-name ${{ env.APP_NAME }}-backend --region ${{ env.ECR_REGION }} --image-scanning-configuration scanOnPush=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.APP_NAME }}-backend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Job 2: Build and Push Frontend
  # ==========================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.ECR_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if not exists
        run: |
          aws ecr describe-repositories --repository-names ${{ env.APP_NAME }}-frontend --region ${{ env.ECR_REGION }} 2>/dev/null || \
          aws ecr create-repository --repository-name ${{ env.APP_NAME }}-frontend --region ${{ env.ECR_REGION }} --image-scanning-configuration scanOnPush=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.APP_NAME }}-frontend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Job 3: Update Kustomize Manifests
  # ==========================================
  update-kustomize:
    name: Update Kustomize
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in kustomization
        run: |
          cd k8s/overlays/dev
          
          # Get short SHA (7 characters)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          # Update kustomization.yaml with new image tags
          cat > kustomization.yaml << EOF
          # ============================================
          # Kustomize Dev Overlay Configuration
          # ============================================
          # Auto-updated by CI/CD pipeline
          # Commit: ${{ github.sha }}
          # Updated: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization

          namespace: ${{ env.APP_NAME }}

          resources:
            - namespace.yaml
            - ../../base

          images:
            - name: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.ECR_REGION }}.amazonaws.com/${{ env.APP_NAME }}-backend
              newTag: ${SHORT_SHA}
            - name: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.ECR_REGION }}.amazonaws.com/${{ env.APP_NAME }}-frontend
              newTag: ${SHORT_SHA}

          commonLabels:
            environment: dev
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git diff --staged --quiet || git commit -m "chore: update image tags to ${{ github.sha }}"
          git push

  # ==========================================
  # Job 4: Pipeline Summary
  # ==========================================
  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, update-kustomize]
    if: always()
    steps:
      - name: Pipeline Summary
        run: |
          echo "========================================"
          echo "     🚀 CI/CD PIPELINE COMPLETE 🚀     "
          echo "========================================"
          echo ""
          echo "📦 Backend Image:  ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.ECR_REGION }}.amazonaws.com/${{ env.APP_NAME }}-backend"
          echo "📦 Frontend Image: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.ECR_REGION }}.amazonaws.com/${{ env.APP_NAME }}-frontend"
          echo ""
          echo "✅ Images pushed to ECR successfully!"
          echo "✅ Kubernetes manifests updated in k8s/overlays/dev/"
          echo ""
          echo "🔄 ArgoCD will automatically sync the deployment"
          echo ""
          echo "🌐 Application URL: ${{ env.ENDPOINT }}"
          echo "========================================"

