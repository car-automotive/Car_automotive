name: Bootstrap Infrastructure

on:
  workflow_dispatch:
  push:
    branches: [car-automotive]
    paths:
      - '.github/workflows/bootstrap-infra.yaml'
      - 'gitops/**'

permissions:
  contents: write
  id-token: write

env:
  ECR_REGION: us-west-2
  EKS_REGION: us-west-1
  AWS_ACCOUNT_ID: "792373136340"
  CLUSTER_NAME: argocd-nonprod-eks
  APP_NAME: car-automotive

jobs:
  setup-ecr:
    name: Setup ECR Repositories
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.ECR_REGION }}

      - name: Create ECR repositories (idempotent)
        run: |
          for REPO in ${{ env.APP_NAME }}-backend ${{ env.APP_NAME }}-frontend; do
            if aws ecr describe-repositories --repository-names "$REPO" --region ${{ env.ECR_REGION }} 2>/dev/null; then
              echo "✓ Repository $REPO already exists"
            else
              echo "Creating repository $REPO..."
              aws ecr create-repository \
                --repository-name "$REPO" \
                --region ${{ env.ECR_REGION }} \
                --image-scanning-configuration scanOnPush=true
              echo "✓ Repository $REPO created"
            fi
          done

  setup-argocd:
    name: Setup ArgoCD
    runs-on: ubuntu-latest
    needs: setup-ecr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.EKS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.EKS_REGION }}

      - name: Create ArgoCD repository secret (idempotent)
        run: |
          SECRET_NAME="repo-${{ env.APP_NAME }}"
          if kubectl get secret "$SECRET_NAME" -n argocd 2>/dev/null; then
            echo "✓ ArgoCD repo secret already exists, updating..."
            kubectl delete secret "$SECRET_NAME" -n argocd
          fi
          kubectl create secret generic "$SECRET_NAME" \
            --namespace argocd \
            --from-literal=type=git \
            --from-literal=url=https://github.com/${{ github.repository }}.git \
            --from-literal=username=git \
            --from-literal=password="${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}"
          kubectl label secret "$SECRET_NAME" -n argocd \
            argocd.argoproj.io/secret-type=repository --overwrite

      - name: Deploy ArgoCD Application (idempotent)
        run: kubectl apply -f gitops/argocd/application.yaml

